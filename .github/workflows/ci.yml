# Scientific Data Harvester — CI
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harvester
          POSTGRES_PASSWORD: harvester
          POSTGRES_DB: harvester_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harvester"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://harvester:harvester@localhost:5432/harvester_test
          JWT_SECRET_KEY: test-secret
        run: |
          cd backend
          pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        run: |
          cd frontend
          npm install
          npm run build

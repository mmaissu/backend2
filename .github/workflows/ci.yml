name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harvester
          POSTGRES_PASSWORD: harvester
          POSTGRES_DB: harvester_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harvester"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend deps
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://harvester:harvester@localhost:5432/harvester_test
          JWT_SECRET_KEY: test-secret
        run: |
          cd backend
          pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        run: |
          cd frontend
          npm install
          npm run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t backend-test ./backend

      - name: Build frontend Docker image
        run: docker build -t frontend-test ./frontend